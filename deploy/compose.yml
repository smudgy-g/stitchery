# Runs on the Droplet from /srv/stitchery. IMAGE_TAG is set by the deploy workflow.
services:
  api:
    image: ghcr.io/smudgy-g/stitchery-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # not published: only Caddy talks to it

  web:
    image: ghcr.io/smudgy-g/stitchery-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-stitchery.adamgriff.dev}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data # TLS certificates; losing these re-issues and can hit Let's Encrypt rate limits
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

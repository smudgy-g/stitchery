# Runs on the Droplet from /srv/stitchery. IMAGE_TAG is set by the deploy workflow.
services:
  app:
    image: ghcr.io/smudgy-g/stitchery:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # not published: only Caddy talks to it

  # Only for HTTPS on the Droplet; hosts with their own HTTPS run the app image alone
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-stitchery.adamgriff.dev}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # TLS certificates; losing these re-issues and can hit Let's Encrypt rate limits
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

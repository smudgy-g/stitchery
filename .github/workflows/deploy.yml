name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/smudgy-g/stitchery

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image is ~3.7 GB; the runner's default free disk is tight
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Typechecks the client too (pnpm build runs svelte-check)
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Test image
        run: docker run --rm "$IMAGE:$GITHUB_SHA" python -m unittest discover -s tests

      - name: Push image
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Deploy to Droplet
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          HOST_KEY: ${{ secrets.DROPLET_HOST_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$HOST_KEY" > ~/.ssh/known_hosts
          scp deploy/compose.yml deploy/Caddyfile "deploy@$HOST:/srv/stitchery/"
          # The run's token is only valid during this job, so nothing long-lived is stored on the server
          ssh "deploy@$HOST" "set -e
            cd /srv/stitchery
            echo '$GHCR_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            export IMAGE_TAG='$GITHUB_SHA'
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -af"
